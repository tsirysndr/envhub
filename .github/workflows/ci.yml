name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          version: v1.0.0-beta.21
      - name: Rust workspace tests
        working-directory: .dagger
        run: dagger api call -m ci test --source ..
      - name: Nix activation smoke tests
        working-directory: .dagger
        run: dagger api call -m ci smoke --source ..
