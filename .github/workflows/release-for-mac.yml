name: release macOS
on:
  release:
    types: [created]
permissions:
  contents: write
jobs:
  release:
    name: release ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - name: Build native binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked -p envhub --release --target "$TARGET"
      - name: Package native binary
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -C "target/$TARGET/release" -czf "dist/envhub_${RELEASE_VERSION}_${TARGET}.tar.gz" envhub
          cd dist
          shasum -a 256 "envhub_${RELEASE_VERSION}_${TARGET}.tar.gz" > "envhub_${RELEASE_VERSION}_${TARGET}.tar.gz.sha256"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
          fail_on_unmatched_files: true
