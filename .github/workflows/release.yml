name: release
on:
  release:
    types: [created]
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          version: v1.0.0-beta.21
      - name: Build release assets
        working-directory: .dagger
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
        run: dagger api call -m ci build --source .. --target "$TARGET" --version "$RELEASE_VERSION" --output ../dist
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
          fail_on_unmatched_files: true
